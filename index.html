<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 40px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            margin-top: 50px;
            background-color: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My First HTML Project</p>
    </header>

    <div class="container">
        <h2>Hello! 👋</h2>
        <p>This website is created using HTML and CSS.</p>

        <button onclick="alert('Hello! Welcome to my website!')">
            Click Me
        </button>
    </div>

    <footer>
        <p>Created by Deekshitha</p>
    </footer>

</body>
</html>
